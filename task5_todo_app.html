<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synent Task 5 - To-Do Web App</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
    }
    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.8rem; font-weight: 700; color: var(--text); }
    header p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
    #todo-form { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    #todo-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #todo-input:focus { border-color: var(--accent); }
    #add-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #add-btn:hover { background: var(--accent-hover); }
    .filter-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 1.2rem; }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    #todo-list { list-style: none; max-height: 320px; overflow-y: auto; }
    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .todo-item.completed span { text-decoration: line-through; color: var(--text-muted); }
    .todo-content { display: flex; align-items: center; gap: 12px; }
    .todo-content input[type="checkbox"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .delete-btn:hover { background: rgba(239, 68, 68, 0.1); }
    .footer-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    #clear-completed { background: none; border: none; color: var(--danger); cursor: pointer; }
    #clear-completed:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Task Master</h1>
      <p>Synent Internship Task 5 - To-Do List App</p>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required />
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer-stats">
      <span id="items-left">0 tasks left</span>
      <button id="clear-completed">Clear Completed</button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('synent_todos')) || [
      { id: '1', text: 'Initialize Git Repository', completed: true },
      { id: '2', text: 'Build To-Do App UI', completed: true },
      { id: '3', text: 'Record Demonstration Video', completed: false }
    ];
    let currentFilter = 'all';

    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const itemsLeft = document.getElementById('items-left');
    const clearCompletedBtn = document.getElementById('clear-completed');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function saveAndRender() {
      localStorage.setItem('synent_todos', JSON.stringify(todos));
      render();
    }

    function render() {
      todoList.innerHTML = '';
      const filtered = todos.filter(todo => {
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        return true;
      });

      if (filtered.length === 0) {
        todoList.innerHTML = '<li style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.9rem;">No tasks found</li>';
      }

      filtered.forEach((todo) => {
        const li = document.createElement('li');
        li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="todo-content">
            <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo('${todo.id}')">
            <span>${escapeHtml(todo.text)}</span>
          </div>
          <button class="delete-btn" onclick="deleteTodo('${todo.id}')" title="Delete Task">&times;</button>
        `;
        todoList.appendChild(li);
      });

      const activeCount = todos.filter(t => !t.completed).length;
      itemsLeft.textContent = `${activeCount} task${activeCount === 1 ? '' : 's'} left`;
    }

    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;
      todos.push({ id: Date.now().toString(), text, completed: false });
      todoInput.value = '';
      saveAndRender();
    });

    window.toggleTodo = (id) => {
      todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveAndRender();
    };

    window.deleteTodo = (id) => {
      todos = todos.filter(t => t.id !== id);
      saveAndRender();
    };

    clearCompletedBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.completed);
      saveAndRender();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    render();
  </script>
</body>
</html>
